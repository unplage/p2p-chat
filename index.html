<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>P2P 安全通信 · 房间直连</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* ==================== 完整样式 ==================== */
        :root { --primary: #07C160; --danger: #ff4d4f; --warning: #faad14; --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; height: 100dvh; overflow: hidden; position: fixed; width: 100%; }
        .container { display: flex; height: 100%; flex-direction: column; }
        .header { background: #2e2e2e; color: white; padding: 12px 16px; padding-top: max(12px, var(--safe-top)); display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: #666; }
        .status-badge.connected { background: var(--primary); }
        .status-badge.transferring { background: var(--warning); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
        .header-actions { display: flex; gap: 12px; }
        .icon-btn { width: 36px; height: 36px; border: none; background: rgba(255,255,255,0.1); color: white; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .icon-btn:disabled { opacity: 0.3; }
        .mode-switch { display: flex; background: white; border-bottom: 1px solid #e0e0e0; }
        .mode-btn { flex:1; padding:12px; border:none; background:transparent; font-size:14px; cursor:pointer; position:relative; }
        .mode-btn.active { color:var(--primary); font-weight:500; }
        .mode-btn.active::after { content:''; position:absolute; bottom:0; left:20%; right:20%; height:2px; background:var(--primary); }
        .content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
        .chat-container { display:flex; flex-direction:column; height:100%; }
        .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
        .message { display:flex; gap:8px; max-width:85%; animation:pop 0.3s; }
        @keyframes pop { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        .message.sent { align-self:flex-end; flex-direction:row-reverse; }
        .msg-avatar { width:36px; height:36px; border-radius:6px; background:#999; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:14px; flex-shrink:0; }
        .message.sent .msg-avatar { background:var(--primary); }
        .msg-content { background:white; padding:10px 14px; border-radius:18px; word-break:break-word; font-size:15px; }
        .message.sent .msg-content { background:#95EC69; border-bottom-right-radius:4px; }
        .message.received .msg-content { border-bottom-left-radius:4px; }
        .msg-time { font-size:10px; color:#999; margin-top:4px; text-align:right; }
        .file-msg { display:flex; align-items:center; gap:10px; padding:12px; background:white; border-radius:12px; min-width:200px; }
        .file-icon { width:40px; height:40px; background:#f0f0f0; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:20px; }
        .file-info { flex:1; }
        .file-name { font-size:14px; font-weight:500; color:#333; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .file-size { font-size:12px; color:#999; }
        .file-progress { margin-top:6px; height:3px; background:#f0f0f0; border-radius:2px; overflow:hidden; }
        .file-progress-bar { height:100%; background:var(--primary); transition:width 0.3s; }
        .transfer-container { padding:20px; display:none; }
        .transfer-container.active { display:block; }
        .vault-card { background:white; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
        .vault-title { font-size:16px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
        .drop-zone { border:2px dashed #ddd; border-radius:12px; padding:40px 20px; text-align:center; transition:all 0.3s; }
        .drop-zone.dragover { border-color:var(--primary); background:#f6ffed; }
        .drop-zone-text { color:#666; font-size:14px; margin-bottom:12px; }
        .drop-zone-hint { color:#999; font-size:12px; }
        .file-input { display:none; }
        .file-list { margin-top:16px; display:flex; flex-direction:column; gap:8px; }
        .file-item { display:flex; align-items:center; padding:12px; background:#f8f8f8; border-radius:8px; }
        .file-item-icon { width:32px; height:32px; background:white; border-radius:6px; display:flex; align-items:center; justify-content:center; margin-right:12px; }
        .file-item-info { flex:1; min-width: 0; }
        .file-item-name { font-size:14px; color:#333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-item-meta { font-size:12px; color:#999; margin-top:2px; }
        .file-item-action { padding:6px 12px; background:var(--primary); color:white; border:none; border-radius:4px; font-size:12px; cursor:pointer; flex-shrink: 0; margin-left: 8px; }
        .file-item-action:disabled { background:#ccc; }
        .system-msg { align-self:center; background:rgba(0,0,0,0.05); color:#666; padding:6px 12px; border-radius:12px; font-size:12px; max-width:90%; text-align:center; }
        .system-msg.error { background:#fff2f0; color:var(--danger); border:1px solid #ffccc7; }
        .system-msg.success { background:#f6ffed; color:var(--primary); border:1px solid #b7eb8f; }
        /* 输入区域重设计：按钮放大，移右侧，椭圆背景 */
        .input-area { background: #f7f7f7; border-top: 1px solid #e0e0e0; padding: 8px 12px; padding-bottom: max(8px, var(--safe-bottom)); }
        .input-row { display: flex; align-items: center; gap: 8px; }
        .msg-input { flex: 1; border: 1px solid #e0e0e0; border-radius: 24px; padding: 12px 16px; font-size: 16px; outline: none; resize: none; max-height: 100px; background: white; font-family: inherit; }
        .msg-input:focus { border-color: var(--primary); }
        .action-buttons { display: flex; align-items: center; gap: 8px; background: white; border-radius: 40px; padding: 4px; border: 1px solid #e0e0e0; }
        .action-btn { width: 44px; height: 44px; border: none; background: transparent; border-radius: 50%; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; position: relative; }
        .action-btn:hover { background: #f0f0f0; }
        .action-btn:active { background: #e0e0e0; }
        .action-btn input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }  
        .send-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 40px; font-size: 16px; cursor: pointer; white-space: nowrap; }
        .send-btn:disabled { background: #ccc; }
        /* 语音消息样式 */
        .voice-message audio { max-width: 200px; height: 40px; outline: none; }
        .voice-message audio::-webkit-media-controls-panel { background-color: transparent; }
        .call-overlay { position:fixed; inset:0; background:#000; z-index:1000; display:none; flex-direction:column; }
        .call-overlay.active { display:flex; }
        .remote-video { flex:1; background:#111; object-fit:cover; }
        .local-pip { position:absolute; top:max(60px, var(--safe-top)); right:16px; width:100px; height:140px; background:#333; border-radius:12px; overflow:hidden; border:2px solid rgba(255,255,255,0.3); }
        .local-pip video { width:100%; height:100%; object-fit:cover; }
        .call-controls { position:absolute; bottom:max(40px, var(--safe-bottom)); left:50%; transform:translateX(-50%); display:flex; gap:24px; background:rgba(0,0,0,0.6); padding:16px 24px; border-radius:40px; }
        .call-btn { width:56px; height:56px; border-radius:50%; border:none; font-size:24px; color:white; cursor:pointer; }
        .call-btn.hangup { background:var(--danger); }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:2000; display:none; align-items:flex-end; justify-content:center; }
        .modal.active { display:flex; }
        .modal-content { background:white; width:100%; max-height:90vh; border-radius:20px 20px 0 0; overflow:hidden; }
        .modal-header { background:#2e2e2e; color:white; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
        .modal-body { padding:20px; }
        .btn { flex:1; padding:12px; border:none; border-radius:8px; font-size:15px; cursor:pointer; }
        .btn-primary { background:var(--primary); color:white; }
        .btn-secondary { background:#f0f0f0; color:#333; }
        .btn-danger { background:var(--danger); color:white; }
        textarea.code-input { width:100%; height:120px; border:1px solid #ddd; border-radius:8px; padding:12px; font-family:monospace; font-size:13px; resize:none; margin:10px 0; background:#f8f8f8; }
        .copy-btn-group { display:flex; gap:8px; margin-top:10px; }
        .copy-btn { flex:1; padding:10px; background:var(--primary); color:white; border:none; border-radius:6px; font-size:13px; cursor:pointer; }
        .copy-btn.secondary { background:#f0f0f0; color:#333; }
        .qr-container { text-align:center; padding:20px; }
        .qr-code { width:200px; height:200px; margin:0 auto; background:white; padding:10px; border-radius:8px; }
        .hidden { display:none !important; }
        .text-center { text-align:center; }
        .room-input { width:100%; padding:15px; font-size:18px; text-align:center; border:2px solid #ddd; border-radius:12px; margin-bottom:15px; outline:none; }
        .room-input:focus { border-color:var(--primary); }
        .peer-id-display { background:#f0f0f0; padding:10px; border-radius:8px; font-family:monospace; word-break:break-all; margin:10px 0; }
        .spinner { margin:20px auto; width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <span id="appTitle">P2P安全通信</span>
            <span class="status-badge" id="connBadge">未连接</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="callBtn" onclick="startCall('video')" disabled>📹</button>
            <button class="icon-btn" id="voiceBtn" onclick="startCall('audio')" disabled>📞</button>
            <button class="icon-btn" onclick="showConnModal()">⚙️</button>
        </div>
    </div>

    <div class="mode-switch" id="modeSwitch" style="display:none">
        <button class="mode-btn active" onclick="switchMode('chat', this)">💬 加密聊天</button>
        <button class="mode-btn" onclick="switchMode('transfer', this)">📦 文件中转</button>
    </div>

    <div class="content" id="chatMode">
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="system-msg" id="connHint">
                    🔒 端到端加密通信<br>支持文字、图片、语音、文件传输<br>
                    <span style="color:#07C160">点击 ⚙️ 输入房间号建立连接</span>
                </div>
            </div>
            <div class="input-area">
                <div class="input-row">
                    <textarea class="msg-input" id="msgInput" placeholder="输入消息..." rows="1" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
                    <div class="action-buttons">
                        <button class="action-btn" id="imageBtn" title="图片">📷<input type="file" accept="image/*" onchange="handleImage(this)" capture="environment"></button>
                        <button class="action-btn" id="fileBtn" title="文件">📎<input type="file" id="file" multiple onchange="handleFile(this)"></button>
                        <button class="action-btn" id="voiceMsgBtn" title="按住说话" onmousedown="startVoiceRecording()" ontouchstart="startVoiceRecording()" onmouseup="stopVoiceRecording()" ontouchend="stopVoiceRecording()" onmouseleave="cancelVoiceRecording()" disabled>🎤</button>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendText()" disabled>发送</button>
                </div>
            </div>
        </div>
    </div>

    <div class="content transfer-container" id="transferMode">
        <div class="vault-card">
            <div class="vault-title">📤 发送文件</div>
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('transferFile').click()">
                <div class="drop-zone-text">点击或拖拽文件到这里</div>
                <div class="drop-zone-hint">支持任意格式，最大 10GB<br>文件将端到端加密传输<br>支持多文件选择，自动排队发送</div>
                <input type="file" class="file-input" id="transferFile" multiple onchange="handleTransferFile(this)">
            </div>
            <div id="sendProgress" class="hidden" style="margin-top:12px">
                <div style="display:flex;justify-content:space-between;font-size:13px;color:#666;margin-bottom:4px">
                    <span id="sendStatusText">传输中...</span>
                    <span id="sendPercent">0%</span>
                </div>
                <div class="file-progress"><div class="file-progress-bar" id="sendBar" style="width:0%"></div></div>
            </div>
        </div>
        <div class="vault-card hidden" id="receivingCard">
            <div class="vault-title">📥 正在接收 / 已接收</div>
            <div class="file-list" id="receivingList"></div>
        </div>
    </div>
</div>

<div class="call-overlay" id="callOverlay">
    <video class="remote-video" id="remoteVideo" autoplay playsinline></video>
    <div class="local-pip"><video id="localVideo" autoplay playsinline muted></video></div>
    <div class="call-controls">
        <button class="call-btn" style="background:rgba(255,255,255,0.2)" id="muteBtn" onclick="toggleMute()" title="麦克风">🎤</button>
        <button class="call-btn" style="background:rgba(255,255,255,0.2)" id="cameraBtn" onclick="toggleCamera()" title="摄像头" hidden>🎥</button>
        <button class="call-btn" style="background:rgba(255,255,255,0.2)" id="switchCamBtn" onclick="switchCamera()" title="切换摄像头" hidden>🔄</button>
        <button class="call-btn" style="background:rgba(255,255,255,0.2)" id="speakerBtn" onclick="toggleSpeaker()" title="扬声器" hidden>🔊</button>
        <button class="call-btn hangup" onclick="hangup()" title="挂断">📞</button>
    </div>
</div>

<div class="modal" id="connModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="font-size:16px">🔗 输入房间号建立P2P连接</h3>
            <button onclick="closeModal()" style="background:none;border:none;color:white;font-size:20px">✕</button>
        </div>
        <div class="modal-body">
            <div id="roomSelect">
                <p style="font-size:14px;color:#666;margin-bottom:20px">房间号是双方约定的任意字符串（例如：myroom123）</p>
                <input type="text" class="room-input" id="roomIdInput" placeholder="输入房间号" maxlength="30" autocomplete="off">
                <div style="display:flex;gap:10px;margin-top:20px">
                    <button class="btn btn-primary" onclick="createRoom()" style="flex:1;padding:16px">🚀 创建房间</button>
                    <button class="btn btn-secondary" onclick="joinRoom()" style="flex:1;padding:16px">🔗 加入房间</button>
                </div>
                <div class="peer-id-display hidden" id="myPeerIdDisplay">我的ID: <span id="myPeerId"></span></div>
            </div>
            <div id="waitingView" class="hidden text-center">
                <p>⏳ 等待对方加入...</p>
                <div class="spinner"></div>
                <button class="btn btn-secondary" onclick="cancelWaiting()" style="margin-top:20px">取消</button>
            </div>
            <div id="successView" class="hidden text-center" style="padding:30px 0">
                <div style="font-size:48px;margin-bottom:10px">✅</div>
                <h3 style="color:var(--primary);margin-bottom:8px">连接成功！</h3>
                <button class="btn btn-primary" onclick="closeModal();showModeSwitch()" style="width:100%;margin-top:20px">开始使用</button>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== PeerJS 配置 ====================
const peerOptions = {
    host: '0.peerjs.com',
    port: 443,
    path: '/',
    secure: true,
    config: {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turns:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
        ],
        iceCandidatePoolSize: 10
    }
};

// ==================== 全局状态 ====================
let peer = null;
let conn = null;
let localStream = null;
let isConnected = false;
let isInCall = false;
let currentCall = null;
let pendingCallType = null;  
let currentCallType = null;  
let currentFacingMode = 'user';  
let audioOutputDevices = [];  
let currentAudioOutputIndex = 0;
let currentMode = 'chat';

// 文件传输状态（支持多文件队列串行处理）
let fileTransferState = {
    sending: false,
    receiving: false,
    fileInfo: null,
    receivedCount: 0,
    receivedSize: 0,
    receivedBitmap: null,
    pendingWrites: [],
    flushTimer: null
};

let fileQueue = [];            // 发送文件队列
let isFileSendingActive = false; // 是否正在发送

let receiveQueue = [];         // 接收文件队列
let currentReceiveFile = null; // 当前接收的文件信息

const CHUNK_SIZE = 16384;
const MAX_FILE_SIZE = 10 * 1024 * 1024 * 1024; // 10GB

let lastUIUpdate = 0;
const UI_UPDATE_INTERVAL = 100;

let mediaRecorder = null;
let audioChunks = [];
let recordingTimer = null;
let recordingStartTime = 0;

let wakeLock = null;

let heartbeatInterval = null;
let heartbeatTimeout = null;
let consecutiveFailures = 0;
const HEARTBEAT_INTERVAL = 60000;       
const HEARTBEAT_TIMEOUT = 7200000;        
const MAX_CONSECUTIVE_FAILURES = 6;     

function addLog(msg, type='system') {
    console.log(msg);
    const messages = document.getElementById('messages');
    if (!messages) return;
    const div = document.createElement('div');
    div.className = `system-msg ${type}`;
    div.style.fontSize = '11px';
    div.textContent = msg;
    messages.appendChild(div);
    div.scrollIntoView({behavior: 'smooth'});
}

// ==================== UI 控制 ====================
function switchMode(mode, btn) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (mode === 'chat') {
        document.getElementById('chatMode').style.display = 'block';
        document.getElementById('transferMode').classList.remove('active');
        document.getElementById('appTitle').textContent = 'P2P加密通信';
    } else {
        document.getElementById('chatMode').style.display = 'none';
        document.getElementById('transferMode').classList.add('active');
        document.getElementById('appTitle').textContent = 'P2P文件中转';
    }
}

function showModeSwitch() { document.getElementById('modeSwitch').style.display = 'flex'; }
function showConnModal() { document.getElementById('connModal').classList.add('active'); resetRoomModal(); }
function closeModal() { document.getElementById('connModal').classList.remove('active'); }

function resetRoomModal() {
    document.getElementById('roomSelect').classList.remove('hidden');
    document.getElementById('waitingView').classList.add('hidden');
    document.getElementById('successView').classList.add('hidden');
    document.getElementById('myPeerIdDisplay').classList.add('hidden');
    document.getElementById('roomIdInput').value = '';
}

function cancelWaiting() {
    if (peer) { peer.destroy(); peer = null; }
    conn = null;
    isConnected = false;
    document.getElementById('connBadge').textContent = '未连接';
    document.getElementById('connBadge').classList.remove('connected');
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('callBtn').disabled = true;
    document.getElementById('voiceBtn').disabled = true;
    document.getElementById('voiceMsgBtn').disabled = true;
    fileQueue = [];
    isFileSendingActive = false;
    receiveQueue = [];
    currentReceiveFile = null;
    resetRoomModal();
}

// ==================== 房间机制 ====================
function createRoom() {
    const roomId = document.getElementById('roomIdInput').value.trim();
    if (!roomId) return alert('请输入房间号');
    peer = new Peer(roomId, peerOptions);
    peer.on('open', (id) => {
        addLog(`房间创建成功，你的ID: ${id}`, 'success');
        document.getElementById('myPeerId').textContent = id;
        document.getElementById('myPeerIdDisplay').classList.remove('hidden');
        document.getElementById('roomSelect').classList.add('hidden');
        document.getElementById('waitingView').classList.remove('hidden');
    });
    peer.on('connection', (incomingConn) => { conn = incomingConn; setupConnection(conn); });
    peer.on('error', (err) => {
        addLog(`Peer错误: ${err.type} - ${err.message}`, 'error');
        if (err.type === 'unavailable-id') alert('该房间号已被占用，请换一个');
        else alert('连接失败: ' + err.message);
        cancelWaiting();
    });
    peer.on('call', (call) => { handleIncomingCall(call); });
}

function joinRoom() {
    const roomId = document.getElementById('roomIdInput').value.trim();
    if (!roomId) return alert('请输入房间号');
    peer = new Peer(peerOptions);
    peer.on('open', (myId) => {
        addLog(`已连接到网络，我的临时ID: ${myId}`, 'system');
        conn = peer.connect(roomId);
        if (!conn) { alert('连接失败，无法创建连接对象'); return; }
        setupConnection(conn);
        document.getElementById('roomSelect').classList.add('hidden');
        document.getElementById('waitingView').classList.remove('hidden');
    });
    peer.on('error', (err) => {
        addLog(`Peer错误: ${err.message}`, 'error');
        alert('连接失败: ' + err.message);
        cancelWaiting();
    });
    peer.on('call', (call) => { handleIncomingCall(call); });
}

// ==================== 数据连接设置 ====================
function setupConnection(connection) {
    conn = connection;
    conn.on('open', () => {
        addLog('数据通道已打开', 'success');
        isConnected = true;
        document.getElementById('connBadge').textContent = '已加密';
        document.getElementById('connBadge').classList.add('connected');
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('callBtn').disabled = false;
        document.getElementById('voiceBtn').disabled = false;
        document.getElementById('voiceMsgBtn').disabled = false;
        document.getElementById('waitingView').classList.add('hidden');
        document.getElementById('successView').classList.remove('hidden');

        startHeartbeat();
        resumeIncompleteTransfers();

        if (currentSendFile && currentSendInfo) {
            sendFileStartTimer = setTimeout(() => {
                sendFileStartTimer = null;
                if (currentSendFile && currentSendInfo && conn && conn.open === true) {
                    try { conn.send(JSON.stringify({ type: 'file-start', info: currentSendInfo })); } catch (e) {}
                }
            }, 1000);
        }
    });

    conn.on('data', (data) => {
        let buffer = null;
        if (data instanceof ArrayBuffer) {
            buffer = data;
        } else if (ArrayBuffer.isView(data)) {
            buffer = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
        } else if (data && typeof data === 'object' && data.byteLength !== undefined) {
            buffer = data;
        }

        if (buffer) {
            handleFileChunk(buffer);
            return;
        }

        try {
            const msg = JSON.parse(data);
            switch (msg.type) {
                case 'text': addMsg('对方', msg.content, 'received'); break;
                case 'image': addImg('对方', msg.content, 'received'); break;
                case 'voice': addVoiceMsg('对方', msg.data, msg.duration, 'received'); break;
                case 'call-request': pendingCallType = msg.callType || 'video'; break;
                case 'file-start': handleFileStart(msg.info); break;
                case 'file-complete-ack': handleFileCompleteAck(msg.id); break;
                case 'file-cancel': handleFileCancel(msg.id); break;
                case 'file-resume-request': handleFileResumeRequest(msg.id, msg.bitmap, msg.total); break;
                case 'file-end': break;
                case 'ping': conn.send(JSON.stringify({ type: 'pong' })); break;
                case 'pong':
                    if (heartbeatTimeout) { clearTimeout(heartbeatTimeout); heartbeatTimeout = null; }
                    consecutiveFailures = 0;
                    break;
            }
        } catch (e) {
            console.error('消息解析失败', e);
        }
    });

    conn.on('close', () => {
        addLog('数据连接已关闭', 'system');
        isConnected = false;
        document.getElementById('connBadge').textContent = '未连接';
        document.getElementById('connBadge').classList.remove('connected');
        document.getElementById('sendBtn').disabled = true;
        document.getElementById('callBtn').disabled = true;
        document.getElementById('voiceBtn').disabled = true;
        document.getElementById('voiceMsgBtn').disabled = true;

        fileQueue = [];
        isFileSendingActive = false;
        receiveQueue = [];
        currentReceiveFile = null;

        if (fileTransferState.flushTimer) { clearTimeout(fileTransferState.flushTimer); fileTransferState.flushTimer = null; }
        fileTransferState.receiving = false;
        fileTransferState.pendingWrites = [];
        fileTransferState.fileInfo = null;

        if (currentSendReject) { currentSendReject(new Error('连接已关闭')); }
        cleanupSendState();

        if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
        if (heartbeatTimeout) { clearTimeout(heartbeatTimeout); heartbeatTimeout = null; }
    });
    
    conn.on('error', (err) => { 
        addLog('数据连接错误: ' + err, 'error');
        if (currentSendReject) { currentSendReject(err); cleanupSendState(); }
    });
}

// ==================== 心跳检测 ====================
function startHeartbeat() {
    if (heartbeatInterval) clearInterval(heartbeatInterval);
    consecutiveFailures = 0;
    heartbeatInterval = setInterval(() => {
        if (conn && conn.open === true) {
            conn.send(JSON.stringify({ type: 'ping' }));
            heartbeatTimeout = setTimeout(() => {
                consecutiveFailures++;
                if (consecutiveFailures >= MAX_CONSECUTIVE_FAILURES) {
                    addLog('❤️‍🩹 心跳连续超时，连接断开', 'error');
                    if (conn) conn.close();
                } else {
                    addLog(`心跳超时 (${consecutiveFailures}/${MAX_CONSECUTIVE_FAILURES})`, 'warning');
                }
            }, HEARTBEAT_TIMEOUT);
        } else {
            clearInterval(heartbeatInterval);
            heartbeatInterval = null;
        }
    }, HEARTBEAT_INTERVAL);
}

// ==================== 消息发送 ====================
function sendText() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !conn) return;
    conn.send(JSON.stringify({type: 'text', content: text}));
    addMsg('我', text, 'sent');
    input.value = '';
    input.style.height = 'auto';
}

function handleImage(input) {
    const file = input.files[0];
    if (!file || !conn) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        compressImage(e.target.result, 800, 0.6).then(compressed => {
            conn.send(JSON.stringify({type: 'image', content: compressed}));
            addImg('我', compressed, 'sent');
        });
    };
    reader.readAsDataURL(file);
    input.value = '';
}

function handleFile(input) {
    const files = input.files;
    if (!files || files.length === 0) return;
    addFilesToQueue(files);
    input.value = '';
}

function compressImage(dataUrl, maxW, q) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxW) { h = (maxW/w)*h; w = maxW; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', q));
        };
        img.src = dataUrl;
    });
}

// ==================== IndexedDB 文件溢出缓冲 ====================
const IDB_DB_NAME = 'p2p-file-cache';
const IDB_VERSION = 1;
let idbFileDb = null;

function idbOpen() {
    return new Promise((resolve, reject) => {
        if (idbFileDb) return resolve(idbFileDb);
        const req = indexedDB.open(IDB_DB_NAME, IDB_VERSION);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('chunks')) {
                db.createObjectStore('chunks', { keyPath: ['transferId', 'seq'] });
            }
            if (!db.objectStoreNames.contains('meta')) {
                db.createObjectStore('meta', { keyPath: 'id' });
            }
        };
        req.onsuccess = (e) => { idbFileDb = e.target.result; resolve(idbFileDb); };
        req.onerror = (e) => reject(e.target.error);
    });
}

function idbPutChunks(transferId, chunks) {
    return idbOpen().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction('chunks', 'readwrite');
        const store = tx.objectStore('chunks');
        for (const c of chunks) { store.put({ transferId, seq: c.seq, data: c.data }); }
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    }));
}

function idbIterateChunks(transferId, cb) {
    return idbOpen().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction('chunks', 'readonly');
        const range = IDBKeyRange.bound([transferId, 0], [transferId, 0xFFFFFFFF]);
        const req = tx.objectStore('chunks').openCursor(range);
        req.onsuccess = async () => {
            const cursor = req.result;
            if (cursor) {
                try { await cb(cursor.value.data, cursor.value.seq); } catch (e) { reject(e); return; }
                cursor.continue();
            } else { resolve(); }
        };
        req.onerror = () => reject(req.error);
    }));
}

function idbPutMeta(meta) {
    return idbOpen().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction('meta', 'readwrite');
        tx.objectStore('meta').put(meta);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    }));
}

function idbGetMeta(id) {
    return idbOpen().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction('meta', 'readonly');
        const req = tx.objectStore('meta').get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
    }));
}

function idbClearTransfer(id) {
    return idbOpen().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(['chunks', 'meta'], 'readwrite');
        const chunkRange = IDBKeyRange.bound([id, 0], [id, 0xFFFFFFFF]);
        tx.objectStore('chunks').delete(chunkRange);
        tx.objectStore('meta').delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    }));
}

function idbGetIncompleteTransfers() {
    return idbOpen().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction('meta', 'readonly');
        const req = tx.objectStore('meta').openCursor();
        const result = [];
        req.onsuccess = () => {
            const cursor = req.result;
            if (cursor) {
                if (cursor.value.status !== 'done') result.push(cursor.value);
                cursor.continue();
            } else { resolve(result); }
        };
        req.onerror = () => reject(req.error);
    }));
}

async function resumeIncompleteTransfers() {
    try {
        const incomplete = await idbGetIncompleteTransfers();
        for (const meta of incomplete) {
            if (currentReceiveFile && currentReceiveFile.id === meta.id) continue;
            console.log(`[接收] 检测到未完成 transfer ${meta.name}，加入恢复队列`);
            receiveQueue.push(meta);
        }
        if (!fileTransferState.receiving && receiveQueue.length > 0) {
            const next = receiveQueue.shift();
            startReceivingFile(next);
        }
    } catch (e) {
        console.warn('续传扫描失败', e);
    }
}

// ==================== 文件发送队列 ====================
function addFilesToQueue(files) {
    if (!conn || conn.open !== true) {
        addLog('❌ 连接未建立，无法发送文件', 'error');
        return;
    }
    if (!files || files.length === 0) return;
    
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (file.size > MAX_FILE_SIZE) {
            addLog(`跳过文件 "${file.name}"：超过 10GB 限制`, 'warning');
            continue;
        }
        fileQueue.push(file);
    }
    
    if (!isFileSendingActive) {
        processFileQueue();
    } else {
        addLog(`已添加 ${files.length} 个文件到队列，等待发送`, 'system');
    }
}

async function processFileQueue() {
    if (fileQueue.length === 0) {
        isFileSendingActive = false;
        const statusSpan = document.getElementById('sendStatusText');
        if (statusSpan) statusSpan.textContent = '全部传输完成';
        return;
    }

    isFileSendingActive = true;
    const file = fileQueue.shift();

    const statusSpan = document.getElementById('sendStatusText');
    if (statusSpan) {
        statusSpan.textContent = `📤 发送: ${file.name} (剩余 ${fileQueue.length} 个)`;
    }
    addLog(`📤 正在发送: ${file.name} (剩余 ${fileQueue.length} 个文件)`, 'system');

    try {
        await sendFileViaP2P(file);
        // 发送成功后自动进入下一个
        processFileQueue();
    } catch (err) {
        addLog(`发送 ${file.name} 失败，已跳过: ${err.message}`, 'error');
        processFileQueue();
    }
}

// ==================== 发送端状态 ====================
let currentSendFile = null;       
let currentSendInfo = null;       
let currentSendResolve = null;
let currentSendReject = null;
let sendFileStartTimer = null;    

// ==================== bitmap / base64 辅助 ====================
function bitmapGet(bm, i) { return (bm[i >> 3] >> (7 - (i & 7))) & 1; }
function bitmapSet(bm, i) { bm[i >> 3] |= 1 << (7 - (i & 7)); }
function bitmapAnySet(bm, total) {
    const fullBytes = total >> 3;
    for (let i = 0; i < fullBytes; i++) if (bm[i] !== 0) return true;
    if (total & 7) {
        const last = bm[fullBytes];
        const mask = (1 << (8 - (total & 7))) - 1;  
        if ((last & ~mask) !== 0) return true;
    }
    return false;
}
function u8ToBase64(u8) {
    let s = '';
    const chunk = 0x8000;
    for (let i = 0; i < u8.length; i += chunk) {
        s += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
    }
    return btoa(s);
}
function base64ToU8(b64) {
    const s = atob(b64);
    const u8 = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
    return u8;
}

function readSlice(file, start, end) {
    const blob = file.slice(start, end);
    if (blob.arrayBuffer) return blob.arrayBuffer();
    return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = () => reject(fr.error);
        fr.readAsArrayBuffer(blob);
    });
}

// ==================== 发送端核心 ====================
function sendFileViaP2P(file) {
    return new Promise(async (resolve, reject) => {
        if (!conn) { reject(new Error('连接未建立')); return; }
        if (fileTransferState.sending) { reject(new Error('已有文件传输中，请稍后')); return; }

        fileTransferState.sending = true;
        currentSendFile = file;
        currentSendResolve = resolve;
        currentSendReject = reject;
        document.getElementById('sendProgress').classList.remove('hidden');
        updateSendProgress(0);

        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
        const transferId = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2)));
        const fileInfo = { id: transferId, name: file.name, size: file.size, type: file.type, chunks: totalChunks };
        currentSendInfo = fileInfo;
        
        try {
            conn.send(JSON.stringify({ type: 'file-start', info: fileInfo }));
        } catch (e) {
            console.warn('file-start 发送失败，等待重连后重发', e);
        }
    });
}

async function waitForDrain() {
    if (!conn || !conn.dataChannel) return;
    const dc = conn.dataChannel;
    const HIGH = 16 * 1024 * 1024;
    const LOW = 4 * 1024 * 1024;
    if (dc.bufferedAmount < HIGH) return;
    dc.bufferedAmountLowThreshold = LOW;
    await new Promise(res => {
        const handler = () => { dc.removeEventListener('bufferedamountlow', handler); res(); };
        dc.addEventListener('bufferedamountlow', handler);
    });
}

async function streamSendAllChunks(file, totalChunks) {
    const stream = file.stream();
    const reader = stream.getReader();
    let sentSize = 0;
    let chunkIndex = 0;
    try {
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const buffer = value.buffer || value;
            for (let offset = 0; offset < buffer.byteLength; offset += CHUNK_SIZE) {
                const chunkData = buffer.slice(offset, Math.min(offset + CHUNK_SIZE, buffer.byteLength));
                await sendChunkSeq(chunkIndex, chunkData);
                sentSize += chunkData.byteLength;
                chunkIndex++;
                if (chunkIndex % 100 === 0) {
                    updateSendProgress(Math.round((sentSize / file.size) * 100));
                }
            }
        }
    } catch (err) {
        console.warn('[发送] 流式发送中断:', err.message);
    }
}

async function sendMissingChunks(file, bitmap, total) {
    let sent = 0;
    for (let seq = 0; seq < total; seq++) {
        if (bitmapGet(bitmap, seq)) continue;
        const start = seq * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, file.size);
        const chunkData = await readSlice(file, start, end);
        await sendChunkSeq(seq, chunkData);
        sent++;
        if (sent % 100 === 0) updateSendProgress(Math.round((seq / total) * 100));
    }
}

async function sendChunkSeq(seq, chunkData) {
    const header = new ArrayBuffer(4);
    new DataView(header).setUint32(0, seq, false);
    const chunkWithSeq = new Uint8Array(header.byteLength + chunkData.byteLength);
    chunkWithSeq.set(new Uint8Array(header), 0);
    chunkWithSeq.set(new Uint8Array(chunkData), 4);

    await waitForDrain();
    for (let retry = 0; retry < 3; retry++) {
        try {
            conn.send(chunkWithSeq.buffer);
            return true;
        } catch (e) {
            await new Promise(r => setTimeout(r, 300));
        }
    }
    return false;
}

function handleFileCompleteAck(id) {
    if (currentSendInfo && currentSendInfo.id === id) {
        console.log(`[发送] 收到 ack ${id}，文件完成`);
        addLog(`文件 "${currentSendInfo.name}" 发送完成`, 'success');
        const resolve = currentSendResolve;
        cleanupSendState();
        if (resolve) resolve(); // 触发 processFileQueue 继续下一个
    }
}

function handleFileCancel(id) {
    if (currentSendInfo && currentSendInfo.id === id) {
        addLog(`文件 "${currentSendInfo.name}" 被对方取消`, 'warning');
        const reject = currentSendReject;
        cleanupSendState();
        if (reject) reject(new Error('对方取消接收')); // 触发 processFileQueue 继续下一个
    }
}

async function handleFileResumeRequest(id, bitmapB64, total) {
    if (!currentSendInfo || currentSendInfo.id !== id || !currentSendFile) {
        try { conn.send(JSON.stringify({ type: 'file-cancel', id })); } catch (e) {}
        return;
    }
    if (sendFileStartTimer) { clearTimeout(sendFileStartTimer); sendFileStartTimer = null; }

    const file = currentSendFile;
    const bitmap = base64ToU8(bitmapB64);
    addLog(`🔄 续传 "${currentSendInfo.name}"，扫描缺失分片...`, 'system');

    if (!bitmapAnySet(bitmap, total)) {
        await streamSendAllChunks(file, total);
    } else {
        await sendMissingChunks(file, bitmap, total);
    }
    try { conn.send(JSON.stringify({ type: 'file-end' })); } catch (e) {}
    updateSendProgress(100);
}

function cleanupSendState() {
    fileTransferState.sending = false;
    currentSendFile = null;
    currentSendInfo = null;
    currentSendResolve = null;
    currentSendReject = null;
    if (sendFileStartTimer) { clearTimeout(sendFileStartTimer); sendFileStartTimer = null; }
    setTimeout(() => {
        if (fileQueue.length === 0) {
            const sp = document.getElementById('sendProgress');
            if (sp) sp.classList.add('hidden');
        }
    }, 2000);
}

// ==================== 接收端核心 ====================
async function handleFileStart(info) {
    // 如果正在接收其他文件，将新文件加入队列
    if (fileTransferState.receiving && currentReceiveFile && currentReceiveFile.id !== info.id) {
        console.log(`[接收] 文件 ${info.name} 加入队列，等待当前文件接收完成`);
        if (!receiveQueue.some(f => f.id === info.id)) {
            receiveQueue.push(info);
        }
        return;
    }
    
    // 如果没有正在接收的文件，直接开始接收
    if (!fileTransferState.receiving) {
        startReceivingFile(info);
    }
}

async function startReceivingFile(info) {
    let meta = null;
    try { meta = await idbGetMeta(info.id); } catch (e) { console.warn('idbGetMeta 失败', e); }

    if (meta && meta.status === 'done') {
        console.log(`[接收] ${info.name} 已完成，补发 ack`);
        try { conn.send(JSON.stringify({ type: 'file-complete-ack', id: info.id })); } catch (e) {}
        return;
    }

    if (meta && meta.status === 'receiving') {
        console.log(`[接收] ${info.name} 已有部分数据，发续传请求`);
        fileTransferState.receiving = true;
        fileTransferState.fileInfo = info;
        currentReceiveFile = info;
        fileTransferState.receivedCount = meta.receivedCount;
        fileTransferState.receivedBitmap = null;  
        fileTransferState.pendingWrites = [];
        if (fileTransferState.flushTimer) { clearTimeout(fileTransferState.flushTimer); fileTransferState.flushTimer = null; }
        lastUIUpdate = 0;
        showReceivingFile(info);
        fileTransferState.receivedBitmap = await buildBitmapFromIdb(info.id, info.chunks);
        await sendResumeRequest(info.id, info.chunks);
        return;
    }

    // 全新接收
    console.log(`[接收] 开始接收文件: ${info.name}，共 ${info.chunks} 片`);
    fileTransferState.receiving = true;
    fileTransferState.fileInfo = info;
    currentReceiveFile = info;
    fileTransferState.receivedCount = 0;
    fileTransferState.receivedSize = 0;
    fileTransferState.receivedBitmap = new Uint8Array(Math.ceil(info.chunks / 8));
    fileTransferState.pendingWrites = [];
    if (fileTransferState.flushTimer) { clearTimeout(fileTransferState.flushTimer); fileTransferState.flushTimer = null; }
    lastUIUpdate = 0;
    try {
        await idbPutMeta({ id: info.id, name: info.name, size: info.size, type: info.type, chunks: info.chunks, receivedCount: 0, status: 'receiving' });
    } catch (e) { console.error('idbPutMeta 失败', e); }
    showReceivingFile(info);
    await sendResumeRequest(info.id, info.chunks);
}

async function sendResumeRequest(id, total) {
    const bitmap = await buildBitmapFromIdb(id, total);
    try {
        conn.send(JSON.stringify({ type: 'file-resume-request', id, bitmap: u8ToBase64(bitmap), total }));
    } catch (e) {
        console.error('发 resume-request 失败', e);
    }
}

async function buildBitmapFromIdb(id, total) {
    const bitmap = new Uint8Array(Math.ceil(total / 8));
    try {
        await idbIterateChunks(id, (data, seq) => { bitmapSet(bitmap, seq); });
    } catch (e) { console.warn('buildBitmapFromIdb 失败', e); }
    return bitmap;
}

async function handleFileChunk(chunk) {
    if (!fileTransferState.receiving || !fileTransferState.fileInfo) return;
    if (!fileTransferState.receivedBitmap) return;

    const view = new DataView(chunk);
    const seq = view.getUint32(0, false);  
    const data = chunk.slice(4);
    if (seq >= fileTransferState.fileInfo.chunks) return;

    if (bitmapGet(fileTransferState.receivedBitmap, seq)) return;
    
    bitmapSet(fileTransferState.receivedBitmap, seq);
    fileTransferState.receivedCount++;
    fileTransferState.receivedSize += data.byteLength;
    fileTransferState.pendingWrites.push({ seq, data: new Uint8Array(data) });

    if (fileTransferState.pendingWrites.length >= 32) {
        await flushPendingWrites();
    } else if (!fileTransferState.flushTimer) {
        fileTransferState.flushTimer = setTimeout(() => { flushPendingWrites(); }, 50);
    }

    const now = Date.now();
    if (now - lastUIUpdate > UI_UPDATE_INTERVAL) {
        updateReceiveProgress();
        lastUIUpdate = now;
    }

    if (fileTransferState.receivedCount === fileTransferState.fileInfo.chunks) {
        await flushPendingWrites();  
        updateReceiveProgress();
        handleFileComplete();
    }
}

async function flushPendingWrites() {
    if (fileTransferState.flushTimer) { clearTimeout(fileTransferState.flushTimer); fileTransferState.flushTimer = null; }
    const pending = fileTransferState.pendingWrites;
    if (pending.length === 0) return;
    fileTransferState.pendingWrites = [];
    try {
        await idbPutChunks(fileTransferState.fileInfo.id, pending);
        const meta = await idbGetMeta(fileTransferState.fileInfo.id);
        if (meta) { meta.receivedCount = fileTransferState.receivedCount; await idbPutMeta(meta); }
    } catch (e) {
        console.error('IDB 批量写入失败', e);
    }
}

async function handleFileComplete() {
    if (!fileTransferState.receiving) return;
    fileTransferState.receiving = false;
    const info = fileTransferState.fileInfo;
    currentReceiveFile = null;
    console.log('[接收] 所有分片已收齐，等待用户下载');
    addLog(`文件接收完成: ${info.name}（点击下载按钮保存）`, 'success');

    try { conn.send(JSON.stringify({ type: 'file-complete-ack', id: info.id })); } catch (e) {}

    try {
        const meta = await idbGetMeta(info.id);
        if (meta) { meta.status = 'done'; await idbPutMeta(meta); }
    } catch (e) { console.warn('更新 meta done 失败', e); }

    showDownloadReady(info);
    
    // 检查并处理接收队列中的下一个文件
    if (receiveQueue.length > 0) {

        startReceivingFile(nextFile);
    }
}

async function downloadReceivedFile(id) {
    let meta;
    try { meta = await idbGetMeta(id); } catch (e) { meta = null; }
    if (!meta) { addLog('❌ 文件数据已不存在', 'error'); return; }
    try {
        if (window.showSaveFilePicker) {
            const handle = await window.showSaveFilePicker({ 
                suggestedName: meta.name
            });
            const writable = await handle.createWritable();
            // IDB 游标按 seq 升序读取，直接流式写入即可保证顺序
            await idbIterateChunks(id, async (data) => { await writable.write(data); });
            await writable.close();
            addLog(`✅ 文件已保存: ${meta.name}`, 'success');
        } else {
            if (meta.size > 500 * 1024 * 1024) {
                throw new Error('文件过大(>500MB)，请使用Chrome等支持文件系统访问API的浏览器');
            }
            const chunks = [];
            await idbIterateChunks(id, (data, seq) => { chunks.push({ seq, data }); });
            // 回退方案必须排序以防万一
            chunks.sort((a, b) => a.seq - b.seq);
            const parts = chunks.map(c => c.data);
            const blob = new Blob(parts, { type: meta.type || 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; 
            a.download = meta.name; 
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 60000);
            addLog(`✅ 文件已保存: ${meta.name}`, 'success');
        }
        
        // 下载成功后清理 IDB
        await idbClearTransfer(id);
        const item = document.querySelector(`#receivingList .file-item[data-id="${id}"]`);
        if (item) item.remove();
        if (document.getElementById('receivingList').children.length === 0) {
            document.getElementById('receivingCard').classList.add('hidden');
        }
    } catch (e) {
        if (e && e.name === 'AbortError') { addLog('已取消下载', 'system'); return; }
        addLog(`❌ 下载失败: ${e.message}`, 'error');
        console.error('下载失败', e);
    }
}

function formatSize(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B','KB','MB','GB','TB'];
    const i = Math.floor(Math.log(bytes)/Math.log(k));
    return parseFloat((bytes/Math.pow(k,i)).toFixed(2)) + ' ' + sizes[i];
}

function escapeHTML(str) {
    return str.replace(/[&<>"]/g, m => {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
    });
}

function handleTransferFile(input) {

    addFilesToQueue(files);
    input.value = '';
}

// ==================== 语音消息录制 ====================
async function startVoiceRecording() {
    if (!conn || conn.open !== true) { alert('请先建立连接'); return; }
    if (mediaRecorder && mediaRecorder.state === 'recording') return;

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) audioChunks.push(event.data);
        };
        mediaRecorder.onstop = () => { stream.getTracks().forEach(track => track.stop()); };
        mediaRecorder.start();
        recordingStartTime = Date.now();
        document.getElementById('voiceMsgBtn').style.backgroundColor = 'var(--danger)';
        recordingTimer = setTimeout(() => {
            if (mediaRecorder && mediaRecorder.state === 'recording') stopVoiceRecording(true);
        }, 60000);
    } catch (err) {
        alert('无法访问麦克风: ' + err.message);
    }
}

function stopVoiceRecording(autoSent = false) {
    if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
    clearTimeout(recordingTimer);
    mediaRecorder.stop();
    document.getElementById('voiceMsgBtn').style.backgroundColor = '';
    setTimeout(() => {
        if (audioChunks.length === 0) return;
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Audio = e.target.result;
            conn.send(JSON.stringify({ type: 'voice', data: base64Audio, duration: Math.round((Date.now() - recordingStartTime) / 1000) }));
            addVoiceMsg('我', base64Audio, (Date.now() - recordingStartTime) / 1000, 'sent');
        };
        reader.readAsDataURL(audioBlob);
    }, 200);
}

function cancelVoiceRecording() {
    if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
    clearTimeout(recordingTimer);
    mediaRecorder.stop();
    audioChunks = [];
    document.getElementById('voiceMsgBtn').style.backgroundColor = '';
    if (mediaRecorder.stream) { mediaRecorder.stream.getTracks().forEach(track => track.stop()); }
}

// ==================== 编解码偏好 ====================
function preferCodec(pc, kind, codecMime) {
    try {
        const caps = RTCRtpSender.getCapabilities(kind);
        if (!caps) return;
        const target = codecMime.toLowerCase();
        const preferred = caps.codecs.filter(c => c.mimeType.toLowerCase() === target);
        if (preferred.length === 0) return;
        const rest = caps.codecs.filter(c => c.mimeType.toLowerCase() !== target);
        const ordered = [...preferred, ...rest];
        pc.getTransceivers().forEach(t => {
            if (t.sender && t.sender.track && t.sender.track.kind === kind) {
                try { t.setCodecPreferences(ordered); } catch (e) {}
            }
        });
    } catch (e) {}
}

// ==================== 自适应码率 ====================
function startAdaptiveBitrate(pc) {
    if (pc._adaptationInterval) clearInterval(pc._adaptationInterval);
    pc._smoothBandwidth = null;
    pc._lastAdjustTime = 0;
    const ALPHA = 0.3;
    const ADJUST_COOLDOWN = 4000;
    const POLL_INTERVAL = 2000;

    try {
        const senders = pc.getSenders();
        const videoSender = senders.find(s => s.track && s.track.kind === 'video');
        if (videoSender) {
            const params = videoSender.getParameters();
            params.degradationPreference = 'balanced';
            videoSender.setParameters(params).catch(() => {});
        }
    } catch (e) {}

    pc._adaptationInterval = setInterval(async () => {
        if (!pc || pc.connectionState !== 'connected' || !isInCall) {
            clearInterval(pc._adaptationInterval);
            pc._adaptationInterval = null;
            return;
        }
        const now = Date.now();
        if (now - pc._lastAdjustTime < ADJUST_COOLDOWN) return;

        try {
            const stats = await pc.getStats();
            let bandwidth = null;
            stats.forEach(report => {
                if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.nominated) {
                    if (report.availableOutgoingBitrate) bandwidth = report.availableOutgoingBitrate;
                }
            });
            if (bandwidth == null) {
                stats.forEach(report => {
                    if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.availableOutgoingBitrate && bandwidth == null) {
                        bandwidth = report.availableOutgoingBitrate;
                    }
                });
            }
            if (!bandwidth) return;

            if (pc._smoothBandwidth === null) pc._smoothBandwidth = bandwidth;
            else pc._smoothBandwidth = ALPHA * bandwidth + (1 - ALPHA) * pc._smoothBandwidth;

            const senders = pc.getSenders();
            const videoSender = senders.find(s => s.track && s.track.kind === 'video');
            if (!videoSender) return;
            const params = videoSender.getParameters();
            if (!params.encodings || params.encodings.length === 0) params.encodings = [{}];

            let maxBitrate, maxFramerate, scaleDownBy;
            const bw = pc._smoothBandwidth;
            if (bw < 150000) { maxBitrate = 120000; maxFramerate = 10; scaleDownBy = 4.0; } 
            else if (bw < 300000) { maxBitrate = 200000; maxFramerate = 12; scaleDownBy = 2.5; } 
            else if (bw < 500000) { maxBitrate = 350000; maxFramerate = 15; scaleDownBy = 2.0; } 
            else if (bw < 1000000) { maxBitrate = 700000; maxFramerate = 24; scaleDownBy = 1.5; } 
            else if (bw < 2000000) { maxBitrate = 1200000; maxFramerate = 30; scaleDownBy = 1.0; } 
            else { maxBitrate = 2000000; maxFramerate = 30; scaleDownBy = 1.0; }

            const enc = params.encodings[0];
            if (enc.maxBitrate !== maxBitrate || enc.maxFramerate !== maxFramerate || enc.scaleResolutionDownBy !== scaleDownBy) {
                enc.maxBitrate = maxBitrate;
                enc.maxFramerate = maxFramerate;
                enc.scaleResolutionDownBy = scaleDownBy;
                await videoSender.setParameters(params);
                pc._lastAdjustTime = now;
            }
        } catch (err) {}
    }, POLL_INTERVAL);
}

// ==================== ICE 重启处理 ====================
function setupIceRestartHandler(pc) {
    pc._isRestartingIce = false;
    pc._iceRestartCount = 0;
    const MAX_ICE_RESTARTS = 3;

    const doRestart = (reason) => {
        if (pc._isRestartingIce) return;
        if (pc._iceRestartCount >= MAX_ICE_RESTARTS) {
            addLog(`❌ 网络持续不可用（ICE 重启 ${MAX_ICE_RESTARTS} 次仍失败），通话结束`, 'error');
            hangup();
            return;
        }
        pc._isRestartingIce = true;
        pc._iceRestartCount++;
        addLog(`${reason}（第 ${pc._iceRestartCount}/${MAX_ICE_RESTARTS} 次重启 ICE）`, 'warning');
        clearTimeout(window.iceDisconnectTimer);
        try {
            pc.restartIce();
            setTimeout(() => { pc._isRestartingIce = false; }, 5000);
        } catch (e) {
            pc._isRestartingIce = false;
            hangup();
        }
    };

    pc.oniceconnectionstatechange = () => {
        const state = pc.iceConnectionState;
        if (state === 'failed') {
            doRestart('⚠️ ICE 连接失败，尝试重启');
        } else if (state === 'disconnected') {
            if (pc._isRestartingIce) return;
            addLog('⚠️ 网络暂时断开，5 秒后尝试恢复...', 'warning');
            clearTimeout(window.iceDisconnectTimer);
            window.iceDisconnectTimer = setTimeout(() => {
                if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                    doRestart('网络仍断开，尝试重启 ICE');
                }
            }, 5000);
        } else if (state === 'connected' || state === 'completed') {
            clearTimeout(window.iceDisconnectTimer);
            pc._isRestartingIce = false;
            pc._iceRestartCount = 0;  
        }
    };
}

async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
        if (wakeLock) { try { await wakeLock.release(); } catch(e){} }
        wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {}
}

function onWakeLockVisibilityChange() {
    if (isInCall && document.visibilityState === 'visible' && 'wakeLock' in navigator) {
        requestWakeLock();
    }
}

// ==================== 音视频通话 ====================
async function startCall(type) {
    if (!conn || !peer) { return alert('请先建立连接'); }
    if (conn.open !== true) { return alert('数据通道未完全打开'); }
    if (isInCall) { return alert('正在通话中'); }
    document.getElementById('callBtn').disabled = true;
    document.getElementById('voiceBtn').disabled = true;
    try {
        try { conn.send(JSON.stringify({ type: 'call-request', callType: type })); } catch(e) {}

        const audioConstraints = { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 48000, sampleSize: 16, channelCount: 1 };
        const constraints = type === 'video'
            ? { video: { width: { ideal: 1280, max: 1920 }, height: { ideal: 720, max: 1080 }, frameRate: { ideal: 30, max: 30 }, aspectRatio: 16/9, facingMode: 'user' }, audio: audioConstraints }
            : { video: false, audio: audioConstraints };

        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        document.getElementById('localVideo').srcObject = localStream;

        const call = peer.call(conn.peer, localStream);
        if (!call) throw new Error('peer.call 返回空');
        currentCall = call;

        const pc = call._pc || call.peerConnection;
        if (pc) {
            preferCodec(pc, 'video', 'video/H264');
            preferCodec(pc, 'audio', 'audio/opus');
            setupIceRestartHandler(pc);
            startAdaptiveBitrate(pc);
        }

        call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
        });
        call.on('close', () => { cleanupCall(); });
        call.on('error', (err) => { cleanupCall(); });

        isInCall = true;
        document.getElementById('callOverlay').classList.add('active');
        resetCallControlsState(type);
        addMsg('系统', type === 'video' ? '📹 视频通话发起中...' : '📞 语音通话发起中...', 'system');

        await requestWakeLock();
        document.addEventListener('visibilitychange', onWakeLockVisibilityChange);

    } catch (err) {
        alert('启动失败: ' + err.message);
        cleanupCall();
    } finally {
        if (!isInCall) {
            document.getElementById('callBtn').disabled = false;
            document.getElementById('voiceBtn').disabled = false;
        }
    }
}

function handleIncomingCall(call) {
    if (isInCall) { call.close(); return; }
    let callType = pendingCallType;
    if (callType) pendingCallType = null;
    else callType = 'video';  

    const typeLabel = callType === 'video' ? '视频' : '语音';
    if (!confirm(`📞 收到${typeLabel}通话请求，是否接听？`)) { call.close(); return; }

    const audioConstraints = { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 48000, sampleSize: 16, channelCount: 1 };
    const constraints = callType === 'video'
        ? { video: { width: { ideal: 1280, max: 1920 }, height: { ideal: 720, max: 1080 }, frameRate: { ideal: 30, max: 30 }, aspectRatio: 16/9, facingMode: 'user' }, audio: audioConstraints }
        : { video: false, audio: audioConstraints };

    navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => {
            localStream = stream;
            document.getElementById('localVideo').srcObject = stream;
            call.answer(stream);
            currentCall = call;

            const pc = call._pc || call.peerConnection;
            if (pc) {
                preferCodec(pc, 'video', 'video/H264');
                preferCodec(pc, 'audio', 'audio/opus');
                setupIceRestartHandler(pc);
                startAdaptiveBitrate(pc);
            }

            call.on('stream', (remoteStream) => { document.getElementById('remoteVideo').srcObject = remoteStream; });
            call.on('close', () => { cleanupCall(); });
            call.on('error', (err) => { cleanupCall(); });

            isInCall = true;
            document.getElementById('callOverlay').classList.add('active');
            resetCallControlsState(callType);
            addMsg('系统', `📞 ${typeLabel}通话已连接`, 'system');

            requestWakeLock();
            document.addEventListener('visibilitychange', onWakeLockVisibilityChange);
        })
        .catch(err => {
            alert('无法获取摄像头/麦克风: ' + err.message);
            call.close();
        });
}

function hangup() { 
    if (currentCall) currentCall.close(); 
    cleanupCall(); 
    addMsg('系统', '📴 通话已结束', 'system'); 
}

function cleanupCall() {
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    document.getElementById('remoteVideo').srcObject = null;
    document.getElementById('localVideo').srcObject = null;
    document.getElementById('callOverlay').classList.remove('active');
    
    if (currentCall) {
        const pc = currentCall._pc || currentCall.peerConnection;
        if (pc && pc._adaptationInterval) { clearInterval(pc._adaptationInterval); pc._adaptationInterval = null; }
    }
    
    isInCall = false;
    currentCall = null;
    currentCallType = null;
    currentFacingMode = 'user';
    document.getElementById('callBtn').disabled = false;
    document.getElementById('voiceBtn').disabled = false;

    document.removeEventListener('visibilitychange', onWakeLockVisibilityChange);
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    clearTimeout(window.iceDisconnectTimer);
}

function toggleMute() {
    if (!localStream) return;
    const audio = localStream.getAudioTracks()[0];
    if (audio) {
        audio.enabled = !audio.enabled;
        document.getElementById('muteBtn').textContent = audio.enabled ? '🎤' : '🎙️';
    }
}

function resetCallControlsState(callType) {
    currentCallType = callType;
    currentFacingMode = 'user';
    const cameraBtn = document.getElementById('cameraBtn');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const speakerBtn = document.getElementById('speakerBtn');

    const isVideo = callType === 'video';
    if (cameraBtn) cameraBtn.hidden = !isVideo;
    if (switchCamBtn) switchCamBtn.hidden = !isVideo;
    const sinkSupported = 'setSinkId' in HTMLMediaElement.prototype;
    if (speakerBtn) speakerBtn.hidden = !sinkSupported;
    if (cameraBtn) cameraBtn.textContent = '🎥';

    if (sinkSupported) { enumerateAudioOutputs().catch(() => {}); }
}

function toggleCamera() {
    if (!localStream) return;
    const video = localStream.getVideoTracks()[0];
    if (!video) return;
    video.enabled = !video.enabled;
    document.getElementById('cameraBtn').textContent = video.enabled ? '🎥' : '🙈';
}

async function switchCamera() {
    if (!localStream) return;
    const video = localStream.getVideoTracks()[0];
    if (!video) return;
    const next = currentFacingMode === 'user' ? 'environment' : 'user';
    try {
        await video.applyConstraints({ video: { facingMode: next } });
        currentFacingMode = next;
    } catch (e) {
        try {
            const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: next }, audio: false });
            const newTrack = newStream.getVideoTracks()[0];
            const sender = (currentCall && (currentCall._pc || currentCall.peerConnection))
                ? (currentCall._pc || currentCall.peerConnection).getSenders().find(s => s.track && s.track.kind === 'video') : null;
            if (sender) await sender.replaceTrack(newTrack);
            localStream.removeTrack(video);
            localStream.addTrack(newTrack);
            video.stop();
            document.getElementById('localVideo').srcObject = localStream;
            currentFacingMode = next;
        } catch (err2) {}
    }
}

async function enumerateAudioOutputs() {
    if (!('setSinkId' in HTMLMediaElement.prototype)) return;
    try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        audioOutputDevices = devices.filter(d => d.kind === 'audiooutput');
        currentAudioOutputIndex = 0;
    } catch (e) { audioOutputDevices = []; }
}

async function toggleSpeaker() {
    if (!('setSinkId' in HTMLMediaElement.prototype)) return;
    if (audioOutputDevices.length === 0) await enumerateAudioOutputs();
    if (audioOutputDevices.length < 2) return;
    currentAudioOutputIndex = (currentAudioOutputIndex + 1) % audioOutputDevices.length;
    const dev = audioOutputDevices[currentAudioOutputIndex];
    const remoteVideo = document.getElementById('remoteVideo');
    try { await remoteVideo.setSinkId(dev.deviceId); } catch (e) {}
}

const dropZone = document.getElementById('dropZone');
if (dropZone) {
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const files = e.dataTransfer.files;
        if (files.length) addFilesToQueue(files);
    });
}

function init() { console.log('P2P 房间直连版（批量文件发送增强版）已初始化'); }
